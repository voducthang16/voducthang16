name: Generate Profile Activity

on:
  # Chạy tự động mỗi 12 giờ
  schedule:
    - cron: "0 */12 * * *" 
  
  # Cho phép chạy thủ công (bấm nút Run workflow)
  workflow_dispatch:
  
  # Chạy mỗi khi push code lên main (để test ngay)
  push:
    branches:
    - main

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 👇 QUAN TRỌNG: Cấp quyền ghi để push branch output
    permissions: 
      contents: write
      
    steps:
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-dark&hide_border=true&bg_color=20232A&color=61DAFB&line=61DAFB&point=ffffff&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
